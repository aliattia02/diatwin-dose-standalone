[pytest]
# `diatwin` lives at the repository root, `backend` modules import each other
# by bare name. Both have to be importable for the suite to run, and putting
# it here means `pytest` works from anywhere without a PYTHONPATH incantation.
pythonpath = . ..
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:.*utcnow.*
