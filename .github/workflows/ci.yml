name: CI

on:
  push:
    # The default branch here is `master`, not `main` — with `main` alone this
    # job never ran on a push, only on pull requests. Both are listed so a
    # rename in either direction keeps the push trigger working.
    branches: [master, main]
  pull_request:

jobs:
  foundation:
    name: diatwin foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r backend/requirements.txt
      - name: diatwin foundation tests
        run: pytest diatwin/tests -q

  backend:
    name: backend api and kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r backend/requirements.txt
      - name: Tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/diatwin_test
          SECRET_KEY: ci-secret-not-used-anywhere-real
        run: pytest tests -q

  parity:
    name: three-way model parity
    runs-on: ubuntu-latest
    # The three implementations of the models — Python, the mobile client and
    # the web frontend — are independent on purpose. This job is what turns
    # that into verification: it fails the build when any pair stops agreeing,
    # and names the side that stands alone when two of three still do.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          # >= 22.15: the frontend parity evaluator needs module.registerHooks
          # and ES module syntax detection for a typeless package.
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r backend/requirements.txt
      - name: Install node
        working-directory: mobile
        run: npm ci
      - name: Generate shared cases
        run: python -m diatwin.verify.parity generate
      - name: Evaluate python side
        run: python -m diatwin.verify.parity python
      - name: Evaluate typescript side
        working-directory: mobile
        run: npx jest __tests__/parity --ci
      - name: Evaluate frontend side
        run: node diatwin/verify/frontend_eval.mjs
      - name: Compare
        run: python -m diatwin.verify.parity compare

  mobile:
    name: mobile typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Kept in step with the parity job so both run the same runtime.
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci
      # A ratchet, not an absolute gate. `tsc --noEmit` reports 185 errors, so
      # gating on zero would make this job permanently red — which is how the
      # register.tsx ValidationResult bug survived in the output, reported six
      # times with the fix named in the message. The ratchet fails on any
      # increase, and on a decrease that has not been recorded, so the number
      # can only go down. See docs/engineering/2026-09-05-pre-ml-audit.md §2.
      - name: Typecheck (ratchet)
        working-directory: mobile
        run: node scripts/typecheck-ratchet.mjs
      - name: Tests
        working-directory: mobile
        run: npx jest --ci --testPathIgnorePatterns=parity

  frontend:
    name: web frontend build and tests
    runs-on: ubuntu-latest
    # The frontend is 51,080 lines that nothing checked: not built here, no
    # tests, no typecheck. The parity job already evaluates 3 of its 16 utils
    # modules as the third side of the model comparison, but that is the only
    # thing standing between this tree and a silent break. This job is the rest
    # of the net — see docs/engineering/2026-09-05-web-frontend-parity-audit.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Kept in step with the parity and mobile jobs so all three run the
          # same runtime.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Tests
        working-directory: frontend
        env:
          # The daily-reset suite is written to be timezone-independent, so this
          # only pins the host clock for anything added later that is not.
          TZ: UTC
        run: npx react-scripts test --watchAll=false --ci
      # Build and lint in one step. `CI=true npm run build` would turn all 175
      # eslint warnings on this tree into errors and make the job red from the
      # day it was added — the same trap the mobile typecheck fell into. This
      # ratchets instead: the build must succeed, and the warning count may only
      # go down. See frontend/scripts/lint-ratchet.mjs.
      - name: Build and lint (ratchet)
        working-directory: frontend
        run: node scripts/lint-ratchet.mjs
